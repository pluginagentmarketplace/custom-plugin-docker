# Docker Optimization Guide
image_size:
  - Use alpine/slim base images
  - Multi-stage builds
  - Remove package caches
  - Combine RUN commands
  - Use .dockerignore

build_speed:
  - Order Dockerfile by change frequency
  - Use BuildKit cache
  - Parallelize builds
  - Use build arguments wisely

runtime_performance:
  - Set memory limits
  - Configure CPU shares
  - Use tmpfs for temp files
  - Optimize health checks
  - Use restart policies
