# Docker Network Configuration Reference
networks:
  bridge:
    description: Default network driver
    use_case: Single host container communication
    command: "docker network create mynetwork"

  overlay:
    description: Multi-host networking
    use_case: Docker Swarm services
    command: "docker network create -d overlay myoverlay"

  host:
    description: Use host networking
    use_case: Performance-critical applications
    command: "docker run --network host myimage"

  none:
    description: No networking
    use_case: Isolated containers
    command: "docker run --network none myimage"
