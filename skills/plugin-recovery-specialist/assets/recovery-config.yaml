# Plugin Recovery Specialist Configuration
# Version: 1.0.0

recovery:
  # Backup settings
  backup:
    enabled: true
    location: /tmp/plugin-backup
    retention_days: 7
    max_backups_per_plugin: 10
    compress: false

  # Recovery behavior
  behavior:
    auto_backup_before_action: true
    verify_after_recovery: true
    rollback_on_failure: true

  # Risk levels
  risk_levels:
    low:
      auto_execute: true
      require_confirmation: false
      logging: basic
    medium:
      auto_execute: true
      require_confirmation: false
      logging: detailed
    high:
      auto_execute: false
      require_confirmation: true
      logging: comprehensive

# Recovery actions
actions:
  cache_clear:
    risk: low
    description: "Clear plugin cache"
    command: "rm -rf ~/.claude/plugins/cache/{plugin_name}"
    reversible: true

  config_restore:
    risk: medium
    description: "Restore configuration from backup"
    backup_required: true
    reversible: true

  permission_fix:
    risk: low
    description: "Fix file permissions"
    commands:
      - "find {plugin_path} -type f -exec chmod 644 {} \\;"
      - "find {plugin_path} -type d -exec chmod 755 {} \\;"
      - "find {plugin_path} -name '*.sh' -exec chmod 755 {} \\;"
      - "find {plugin_path} -name '*.py' -exec chmod 755 {} \\;"

  version_rollback:
    risk: high
    description: "Rollback to previous version"
    backup_required: true
    confirmation_message: |
      This will rollback the plugin to a previous version.
      All changes since that version will be lost.

  full_reinstall:
    risk: high
    description: "Complete plugin reinstallation"
    backup_required: true
    confirmation_message: |
      This will completely remove and reinstall the plugin.
      Ensure you have a backup of any customizations.

# Verification checks
verification:
  post_recovery:
    - check_structure
    - check_permissions
    - check_syntax
    - run_health_check

# Logging
logging:
  enabled: true
  file: /tmp/plugin-recovery.log
  format: "%(asctime)s - %(levelname)s - %(message)s"
  max_size: 10MB
  backup_count: 5
