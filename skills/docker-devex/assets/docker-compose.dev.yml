version: '3.8'

services:
  app:
    build:
      context: .
      target: development
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
      - "9229:9229"  # Debugger
    command: npm run dev
    environment:
      - NODE_ENV=development
      - DEBUG=app:*

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: devpass
    ports:
      - "5432:5432"
