# Plugin Health Monitor Configuration
# Generated by plugin-health-agent
# Version: 1.0.0

monitoring:
  # Health score thresholds
  thresholds:
    healthy: 85      # Score >= 85 is HEALTHY
    warning: 70      # Score >= 70 is WARNING
    critical: 50     # Score >= 50 is CRITICAL
    # Score < 50 is FAILING

  # Check intervals (in minutes)
  intervals:
    full_check: 60        # Complete health check
    quick_check: 15       # Basic structure check
    continuous: 5         # Lightweight monitoring

  # Factor weights (must sum to 1.0)
  weights:
    structure: 0.25       # Directory/file structure
    syntax: 0.20          # YAML/JSON/Markdown syntax
    mcp: 0.15             # MCP connectivity
    loading: 0.25         # Component loading success
    stability: 0.15       # Error history & stability

# Structure validation
structure:
  required_dirs:
    - .claude-plugin
    - agents
    - skills
    - commands
    - hooks
  required_files:
    - .claude-plugin/plugin.json
    - README.md
  optional_files:
    - .claude-plugin/marketplace.json
    - CHANGELOG.md
    - LICENSE

# Syntax validation
syntax:
  yaml_frontmatter:
    required_agent_fields:
      - name
      - description
      - model
      - tools
    required_skill_fields:
      - name
      - description
      - sasmp_version
      - bonded_agent
      - bond_type
    required_command_fields:
      - description
      - allowed-tools
  json_files:
    - plugin.json
    - marketplace.json
    - hooks.json

# Stability tracking
stability:
  error_window: 168      # Hours (7 days)
  warning_threshold: 5   # Warnings before score reduction
  critical_threshold: 2  # Critical errors before major reduction

# Alerting
alerts:
  enabled: true
  channels:
    - log_file
    - console
  log_path: /tmp/plugin-health.log

# Reporting
reporting:
  format: text           # text, json, yaml
  include_recommendations: true
  include_history: true
  max_history_items: 10
